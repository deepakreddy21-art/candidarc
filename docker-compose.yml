services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: candidarc
      POSTGRES_PASSWORD: candidarc
      POSTGRES_DB: candidarc
    ports:
      - "5432:5432"
    volumes:
      - candidarc_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candidarc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - candidarc_redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - candidarc_minio:/data

  python-backend:
    build:
      context: ./services/python-backend
    environment:
      APP_MODE: demo
      AI_MODE: mock
      PYTHON_BACKEND_TOKEN: dev-python-backend-token-change-me
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Optional Temporal (uncomment when WORKFLOW_ENGINE=temporal)
  # temporal:
  #   image: temporalio/auto-setup:1.25.2
  #   depends_on:
  #     - postgres
  #   environment:
  #     - DB=postgres12
  #     - DB_PORT=5432
  #     - POSTGRES_USER=candidarc
  #     - POSTGRES_PWD=candidarc
  #     - POSTGRES_SEEDS=postgres
  #   ports:
  #     - "7233:7233"

volumes:
  candidarc_pg:
  candidarc_redis:
  candidarc_minio:
