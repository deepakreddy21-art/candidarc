services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: candidarc
      POSTGRES_PASSWORD: candidarc
      POSTGRES_DB: candidarc
    ports:
      - "5432:5432"
    volumes:
      - candidarc_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candidarc && psql -U candidarc -d candidarc -c 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - candidarc_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - candidarc_minio:/data

  migrate:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      CANDIDARC_DATA_MODE: postgres
      DATABASE_URL: postgres://candidarc:candidarc@postgres:5432/candidarc
      APP_MODE: demo
      AI_MODE: mock
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bash", "-lc", "npm ci && npm run db:migrate"]
    restart: "no"

  python-backend:
    build:
      context: ./services/python-backend
    environment:
      APP_MODE: demo
      AI_MODE: mock
      PYTHON_BACKEND_TOKEN: dev-python-backend-token-change-me
      EVIDENCE_STORE: memory
      DATABASE_URL: postgres://candidarc:candidarc@postgres:5432/candidarc
      REDIS_URL: redis://redis:6379
      EMBEDDING_PROVIDER: mock
      EMBEDDING_MODEL: mock-hash-v1
      EMBEDDING_DIMENSIONS: "1536"
      # Internal-only by default; do not publish 8090 in production compose overlays.
      HOST: 0.0.0.0
      PORT: "8090"
    expose:
      - "8090"
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      target: web
    environment:
      APP_MODE: demo
      AI_MODE: mock
      CANDIDARC_DATA_MODE: postgres
      DATABASE_URL: postgres://candidarc:candidarc@postgres:5432/candidarc
      REDIS_URL: redis://redis:6379
      QUEUE_BACKEND: redis
      PYTHON_BACKEND_URL: http://python-backend:8090
      PYTHON_BACKEND_TOKEN: dev-python-backend-token-change-me
      RESUME_INTELLIGENCE_BACKEND: typescript
      SHADOW_SAMPLE_PERCENT: "0"
      APP_URL: http://localhost:3000
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: candidarc
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-backend:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    environment:
      APP_MODE: demo
      AI_MODE: mock
      CANDIDARC_DATA_MODE: postgres
      DATABASE_URL: postgres://candidarc:candidarc@postgres:5432/candidarc
      REDIS_URL: redis://redis:6379
      QUEUE_BACKEND: redis
      PYTHON_BACKEND_URL: http://python-backend:8090
      PYTHON_BACKEND_TOKEN: dev-python-backend-token-change-me
      RESUME_INTELLIGENCE_BACKEND: typescript
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: candidarc
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-backend:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  candidarc_pg:
  candidarc_redis:
  candidarc_minio:
