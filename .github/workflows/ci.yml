name: CI
on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          APP_MODE: demo
          AI_MODE: mock
          CANDIDARC_DATA_MODE: memory

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: candidarc
          POSTGRES_PASSWORD: candidarc
          POSTGRES_DB: candidarc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U candidarc -d candidarc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://candidarc:candidarc@localhost:5432/candidarc_test
      REDIS_URL: redis://localhost:6379
      CANDIDARC_DATA_MODE: postgres
      APP_MODE: demo
      AI_MODE: mock
      CANDIDARC_REQUIRE_INFRA: "1"
      QUEUE_BACKEND: redis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - name: Verify pgvector evidence embedding tables
        run: |
          docker run --rm --network host pgvector/pgvector:pg16 \
            psql "postgres://candidarc:candidarc@127.0.0.1:5432/candidarc_test" \
            -c "SELECT extname FROM pg_extension WHERE extname='vector';" \
            -c "SELECT to_regclass('public.evidence_documents'), to_regclass('public.evidence_chunks');"
      - run: npm run test:integration
      - run: npm run test:production

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          APP_MODE: demo
          NEXT_PUBLIC_APP_MODE: demo
          AI_MODE: mock
          CANDIDARC_DATA_MODE: memory

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          APP_MODE: production
          NEXT_PUBLIC_APP_MODE: production

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: candidarc
          POSTGRES_PASSWORD: candidarc
          POSTGRES_DB: candidarc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U candidarc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/python-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install pinned requirements
        run: |
          if [ -f requirements.txt ]; then
            pip install --require-hashes -r requirements.txt || pip install -r requirements.txt
          fi
          pip install -e ".[dev]"
      - run: ruff check app tests evals
      - run: mypy app
      - run: pytest -q
        env:
          APP_MODE: demo
          AI_MODE: mock
          EVIDENCE_STORE: memory
          DATABASE_URL: postgres://candidarc:candidarc@localhost:5432/candidarc_test
      - name: OpenAPI contract drift check
        run: python scripts/check_openapi_drift.py
      - name: Fictional resume evaluation suite
        run: python -m evals.run_eval
        env:
          APP_MODE: demo
          AI_MODE: mock
          EVIDENCE_STORE: memory

  python-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - name: Create Python venv and install pinned deps
        working-directory: services/python-backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            .venv/bin/pip install --require-hashes -r requirements.txt || .venv/bin/pip install -r requirements.txt
          fi
          .venv/bin/pip install -e ".[dev]"
      - run: npm run test:python-mode
        env:
          APP_MODE: demo
          AI_MODE: mock
          PYTHON_BACKEND_TOKEN: dev-python-backend-token-change-me

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target web -t candidarc:web .
      - run: docker build --target worker -t candidarc:worker .
      - run: docker build -t candidarc:python-backend ./services/python-backend
      - name: Ensure secrets and private fixtures are not in image
        run: |
          docker create --name candidarc-web-check candidarc:web
          docker export candidarc-web-check | tar -t | tee /tmp/image-files.txt
          docker rm candidarc-web-check
          ! grep -E '(^|/)\.env($|\.)' /tmp/image-files.txt
          ! grep -E '\.local-fixtures' /tmp/image-files.txt
          ! grep -E '(^|/)\.git(/|$)' /tmp/image-files.txt
      - name: Mock-stack smoke (postgres+redis+python readiness)
        run: npm run smoke:docker
        env:
          COMPOSE_DOCKER_CLI_BUILD: 1
          DOCKER_BUILDKIT: 1

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for private contact fixtures and secret patterns
        run: |
          set -euo pipefail
          if git ls-files | grep -E '^\.local-fixtures/'; then
            echo "Private fixtures must not be tracked"
            exit 1
          fi
          if git grep -n -I -E '312-459-9869|kilarudeepakreddy@gmail\.com|sk-[A-Za-z0-9]{20,}|ANTHROPIC_API_KEY[[:space:]]*=[[:space:]]*['\''\"]?sk-' -- . ':!.github/workflows/ci.yml'; then
            echo "Forbidden secret or private contact pattern found in tracked files"
            exit 1
          fi
          echo "Secret scan passed"
