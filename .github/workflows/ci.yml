name: CI
on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: npm audit (fail on high+)
        run: npm audit --audit-level=high
      - name: Document moderate audit exceptions
        run: |
          test -f docs/npm-audit-exceptions.md
          grep -q '2026-12-01' docs/npm-audit-exceptions.md

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          APP_MODE: demo
          AI_MODE: mock
          CANDIDARC_DATA_MODE: memory

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: candidarc
          POSTGRES_PASSWORD: candidarc
          POSTGRES_DB: candidarc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U candidarc -d candidarc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://candidarc:candidarc@localhost:5432/candidarc_test
      REDIS_URL: redis://localhost:6379
      CANDIDARC_DATA_MODE: postgres
      APP_MODE: demo
      AI_MODE: mock
      CANDIDARC_REQUIRE_INFRA: "1"
      QUEUE_BACKEND: redis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - name: Verify pgvector evidence embedding tables
        run: |
          docker run --rm --network host pgvector/pgvector:pg16 \
            psql "postgres://candidarc:candidarc@127.0.0.1:5432/candidarc_test" \
            -c "SELECT extname FROM pg_extension WHERE extname='vector';" \
            -c "SELECT to_regclass('public.evidence_documents'), to_regclass('public.evidence_chunks');"
      - run: npm run test:integration
      - run: npm run test:production

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          APP_MODE: demo
          NEXT_PUBLIC_APP_MODE: demo
          AI_MODE: mock
          CANDIDARC_DATA_MODE: memory

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          APP_MODE: production
          NEXT_PUBLIC_APP_MODE: production

  python-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - name: Install Python deps for OpenAPI export
        working-directory: services/python-backend
        run: |
          python -m pip install --upgrade pip
          python scripts/verify_lock.py
          pip install --require-hashes -r requirements.txt
          pip install --no-deps -e .
      - name: Regenerate Python→TS contract
        run: npm run contract:python
      - name: Fail on OpenAPI / generated contract drift
        run: |
          git diff --exit-code -- \
            services/python-backend/openapi.json \
            server/intelligence/generated/python-paths.ts \
            server/intelligence/generated/python-schemas.ts

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: candidarc
          POSTGRES_PASSWORD: candidarc
          POSTGRES_DB: candidarc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U candidarc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/python-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Verify hashed lock
        run: python scripts/verify_lock.py
      - name: Install pinned requirements
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --no-deps -e .
          pip install --require-hashes -r requirements-dev.txt
      - name: Python dependency vulnerability audit
        run: |
          pip install pip-audit
          # Prefer fail on high/critical. Document any --ignore-vuln in
          # docs/python-resume-intelligence-rollout.md with expiry 2026-12-01.
          pip-audit -r requirements.txt --strict
      - run: ruff check app tests evals
      - run: mypy app
      - run: pytest -q
        env:
          APP_MODE: demo
          AI_MODE: mock
          EVIDENCE_STORE: memory
          DATABASE_URL: postgres://candidarc:candidarc@localhost:5432/candidarc_test
      - name: OpenAPI contract drift check
        run: python scripts/check_openapi_drift.py
      - name: Fictional resume evaluation suite
        run: python -m evals.run_eval
        env:
          APP_MODE: demo
          AI_MODE: mock
          EVIDENCE_STORE: memory

  python-pgvector:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: candidarc
          POSTGRES_PASSWORD: candidarc
          POSTGRES_DB: candidarc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U candidarc -d candidarc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://candidarc:candidarc@localhost:5432/candidarc_test
      EVIDENCE_STORE: postgres
      RUN_PGVECTOR_TESTS: "1"
      APP_MODE: demo
      AI_MODE: mock
      EMBEDDING_PROVIDER: mock
      EMBEDDING_DIMENSIONS: "1536"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: npm run db:migrate
      - name: Install Python hashed deps
        working-directory: services/python-backend
        run: |
          python -m pip install --upgrade pip
          python scripts/verify_lock.py
          pip install --require-hashes -r requirements.txt
          pip install --no-deps -e .
          pip install --require-hashes -r requirements-dev.txt
      - name: Mandatory pgvector evidence-store integration
        working-directory: services/python-backend
        run: |
          set -euo pipefail
          OUT="$(mktemp)"
          # pytest -q prints a short summary; capture full output for skip detection.
          pytest tests/integration/test_evidence_store_postgres.py -v --tb=short | tee "$OUT"
          if grep -Eiq '(^|[ =])skipped([ =]|$)|SKIPPED' "$OUT"; then
            echo "pgvector tests skipped unexpectedly under RUN_PGVECTOR_TESTS=1"
            exit 1
          fi
          # Expect at least the known suite size (upsert, tenant, owner, upsert-dim, connect-dim).
          PASSED="$(grep -Eoc 'PASSED' "$OUT" || true)"
          if [ "${PASSED}" -lt 5 ]; then
            echo "Expected >=5 passed pgvector tests, got ${PASSED}"
            exit 1
          fi

  python-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - name: Create Python venv and install pinned deps
        working-directory: services/python-backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python scripts/verify_lock.py
          .venv/bin/pip install --require-hashes -r requirements.txt
          .venv/bin/pip install --no-deps -e .
          .venv/bin/pip install --require-hashes -r requirements-dev.txt
      - run: npm run test:python-mode
        env:
          APP_MODE: demo
          AI_MODE: mock
          PYTHON_BACKEND_TOKEN: dev-python-backend-token-change-me

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target web -t candidarc:web .
      - run: docker build --target worker -t candidarc:worker .
      - name: Verify Python lock before image build
        working-directory: services/python-backend
        run: |
          python -m pip install --upgrade pip
          python scripts/verify_lock.py
      - run: docker build -t candidarc:python-backend ./services/python-backend
      - name: Ensure secrets and private fixtures are not in image
        run: |
          docker create --name candidarc-web-check candidarc:web
          docker export candidarc-web-check | tar -t | tee /tmp/image-files.txt
          docker rm candidarc-web-check
          ! grep -E '(^|/)\.env($|\.)' /tmp/image-files.txt
          ! grep -E '\.local-fixtures' /tmp/image-files.txt
          ! grep -E '(^|/)\.git(/|$)' /tmp/image-files.txt
      - name: Full-stack mock smoke (postgres+redis+minio+migrate+python+web+worker)
        run: npm run smoke:docker
        env:
          COMPOSE_DOCKER_CLI_BUILD: 1
          DOCKER_BUILDKIT: 1

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (pinned)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Extra pattern scan (private fixtures + known contacts)
        run: |
          set -euo pipefail
          if git ls-files | grep -E '^\.local-fixtures/'; then
            echo "Private fixtures must not be tracked"
            exit 1
          fi
          if git grep -n -I -E '312-459-9869|kilarudeepakreddy@gmail\.com|sk-[A-Za-z0-9]{20,}|ANTHROPIC_API_KEY[[:space:]]*=[[:space:]]*['\''\"]?sk-' -- . ':!.github/workflows/ci.yml'; then
            echo "Forbidden secret or private contact pattern found in tracked files"
            exit 1
          fi
          echo "Secret scan passed"
