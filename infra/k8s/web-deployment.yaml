apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: candidarc }
spec:
  replicas: 2
  selector: { matchLabels: { app: candidarc-web } }
  template:
    metadata: { labels: { app: candidarc-web } }
    spec:
      containers:
        - name: web
          image: candidarc/web:latest
          ports: [{ containerPort: 3000 }]
          envFrom: [{ configMapRef: { name: candidarc-config } }, { secretRef: { name: candidarc-runtime } }]
          readinessProbe: { httpGet: { path: /api/v1/ready, port: 3000 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/v1/health, port: 3000 }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
